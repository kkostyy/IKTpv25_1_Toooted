# Väljalase: sildi (nt v1.0) lükkamisel ehitatakse Windowsi versioon ja telefoni APK ning lisatakse GitHub Release'i
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versioon:
        description: 'Versioon (silt), nt v1.0'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Ehita
        run: dotnet publish IKTpv25_1_Toooted/IKTpv25_1_Toooted.csproj -c Release -r win-x64 --self-contained false -o valjund
      - name: Paki
        run: |
          Remove-Item valjund\*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path valjund\* -DestinationPath AktPood-Windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: AktPood-Windows.zip
          tag_name: ${{ inputs.versioon || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: AKT pood ${{ inputs.versioon || github.ref_name }}
          body: |
            **Windows:** AktPood-Windows.zip (vajab .NET 8 Desktop Runtime'i). Paki lahti ja käivita IKTpv25_1_Toooted.exe. Moodne disain: Ctrl+Shift+M.
            **Telefon (Android 8+):** AktPood.apk – laadi telefoni ja ava (luba "tundmatutest allikatest").
            Proovi: mari / mari123 (klient) või admin / admin123 (omanik).

  android:
    runs-on: ubuntu-latest
    needs: windows   # väljalase on siis juba olemas, APK lisatakse samasse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../AktPood.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: AktPood.apk
          tag_name: ${{ inputs.versioon || github.ref_name }}
