# Android: APK + ekraanipildid kõigist vaadetest. Tulemus lisatakse eelväljalaske "android" juurde.
name: Android

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: APK ja ekraanipildid
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease recordPaparazziDebug 2>&1 | tee ../ehitus.log
      - name: Vead
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A3 ehitus.log | head -150
      - name: Paki
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk AktPood.apk
          cd android/app/src/test/snapshots/images && zip -q ../../../../../../ekraanid.zip *.png
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          target_commitish: ${{ github.sha }}
          name: AKT pood Android (testversioon)
          prerelease: true
          make_latest: false
          files: |
            AktPood.apk
            ekraanid.zip
          body: |
            Telefoni versioon (Android 8+). Laadi AktPood.apk telefoni ja ava (luba "tundmatutest allikatest").
            Proovi: mari / mari123 (klient) või admin / admin123 (omanik).
